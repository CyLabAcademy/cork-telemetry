name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      # Deliberately no CGO_ENABLED=0 here: the race detector needs cgo, and
      # this step is about the code being right rather than about the artifact.
      # The verdict is a rule the whole fleet's placement rests on, and it is
      # pure, so there is no excuse for not exercising it on every push.
      - name: Test
        run: go test -race ./...

      # Static linux binaries: workers run these directly, no libc assumptions.
      # Built here only to prove they still build -- the binaries that get
      # deployed are the ones the release workflow builds from a tag, so there
      # is nothing to keep from this run.
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -o dist/telemetry .
          go build -trimpath -o dist/telemetry-debug ./debug
